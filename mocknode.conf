app_name: mocknode

# Starts one HTTP JSON-RPC service per nodes entry on consecutive ports:
# http://127.0.0.1:18545, http://127.0.0.1:18546, ...
base_addr: "127.0.0.1"
base_port: 18545

# Per-node network profiles. List order defines node IDs and port offsets.
nodes:
  - latency: 0s
    latency_jitter: 0s
    drop_rate: 0
  - latency: 100ms
    latency_jitter: 50ms
    drop_rate: 0.05

database:
  host: "127.0.0.1"
  port: 3306
  user: root
  password: "123456"
  dbname: mocknode_bsc_testnet
  charset: utf8mb4
  parseTime: true
  loc: Local
